name: void_scriptor
description: Void Scriptor - Flutter desktop app for Void Cube Saga worldbuilding
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  collection: ^1.18.0
  json_annotation: ^4.8.0
  uuid: ^4.2.0
  yaml: ^3.1.0
  markdown: ^7.1.0
  font_awesome_flutter: ^10.6.0
  google_fonts: ^6.1.0
  provider: ^6.1.0
  riverpod: ^2.4.0
  freezed_annotation: ^2.4.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - fonts/
