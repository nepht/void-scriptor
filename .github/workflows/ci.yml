name: Multiplatform CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-web-android:
    name: Analyze, test, Linux, Web, Android
    runs-on: ubuntu-latest
    # 13 Sep: era billing-hidup membuktikan job ini butuh ~31 mnt penuh
    # (Test 4326 lolos, lalu Android build kena cut 30 mnt) -> 45 mnt.
    # Test suite penuh ±38 mnt (sebelumnya job mati cepat di format/analyze,
    # jadi anggaran 45 mnt tak pernah teruji) + tooling/SBOM/metadata + build
    # Linux, Web, dan Android. 70 mnt memberi ruang tanpa membuang runner.
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # 2 Okt: v4.0.1 gagal 'Failed to find package tools' — paket 'tools' dihapus
        # Google dari repo Android SDK. v4.0.4 menambahkan guard eksplisit yang
        # me-skip paket deprecated itu (src/main.ts:186-191).

      - name: Verify repository hardening
        run: python3 tools/verify_repository_hardening.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test repository tooling
        run: |
          python3 test/tools/test_verify_repository_hardening.py -v
          python3 test/tools/test_generate_release_metadata.py -v

      - name: Generate SBOM and third-party notices
        run: python3 tools/generate_release_metadata.py

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: build/release-metadata/
          if-no-files-found: error
          retention-days: 30

      - name: Build Linux debug
        run: flutter build linux --debug

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

  build-windows:
    name: Build Windows debug
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows debug
        run: flutter build windows --debug

  build-apple-platforms:
    name: Build macOS and iOS simulator
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Build macOS debug
        run: flutter build macos --debug

      - name: Build iOS simulator without signing
        run: flutter build ios --simulator --debug --no-codesign
