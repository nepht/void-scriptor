name: Release Train

on:
  push:
    tags:
      - 'v1.2.0-rc.*'
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Commit, branch, or tag to package'
        required: true
        default: 'master'
        type: string
      publish_r2:
        description: 'Upload the signed Windows bundle to Cloudflare R2'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-bundle:
    name: Build RC candidate and checksum manifest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Verify repository hardening
        run: python3 tools/verify_repository_hardening.py

      - name: Run release candidate tests
        run: flutter test

      - name: Build supported candidate artifacts
        run: |
          flutter build linux --debug
          flutter build web --release
          flutter build apk --debug

      - name: Generate SBOM and notices
        run: python3 tools/generate_release_metadata.py

      - name: Generate candidate checksum manifest
        run: |
          python3 tools/generate_release_metadata.py \
            --artifacts-dir build \
            --manifest-path build/release-metadata/release-artifact-manifest.json

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: build/release-metadata/
          if-no-files-found: error
          retention-days: 30

      - name: Print release handoff
        run: |
          echo "RC bundle generated for ${{ github.ref_name }}."
          echo "GitHub Release publication remains an explicit D6 action."
          echo "Manifest: build/release-metadata/release-artifact-manifest.json"
          sha256sum build/release-metadata/release-artifact-manifest.json
      
      # Deliberately no release-publish step: Choirudin retains D6 authority.
      # The artifact and manifest are the verified handoff for that decision.

  windows-signed-candidate:
    name: Build and sign Windows RC candidate
    runs-on: windows-2022
    timeout-minutes: 45
    # Configure these repository/environment secrets before enabling a signed run:
    # WINDOWS_CODESIGN_PFX_BASE64, WINDOWS_CODESIGN_PFX_PASSWORD,
    # WINDOWS_CODESIGN_SUBJECT. Secrets are never written to logs or the repo.
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Build Windows release candidate
        run: flutter build windows --release --no-pub

      - name: Require signing secrets
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
        run: |
          $missing = @(
            if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { 'WINDOWS_CODESIGN_PFX_BASE64' }
            if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { 'WINDOWS_CODESIGN_PFX_PASSWORD' }
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_SUBJECT)) { 'WINDOWS_CODESIGN_SUBJECT' }
          )
          if ($missing.Count -gt 0) {
            Write-Error ('Signing is fail-closed. Configure GitHub secret(s): ' + ($missing -join ', '))
            exit 1
          }
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'void-scriptor-signing.pfx'), $bytes)
          Remove-Variable PFX_BASE64 -ErrorAction SilentlyContinue

      - name: Locate SignTool
        shell: pwsh
        run: |
          $tool = Get-ChildItem -Path ${env:ProgramFiles(x86)}\Windows Kits\10\bin -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $tool) { throw 'signtool.exe was not found on windows-2022 runner' }
          "SIGNTOOL=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign Windows binaries
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'void-scriptor-signing.pfx'
          $files = Get-ChildItem -Path 'build/windows/x64/runner/Release' -Include *.exe,*.dll -File -Recurse
          if ($files.Count -eq 0) { throw 'No Windows executable or DLL was produced' }
          foreach ($file in $files) {
            & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($file.FullName)" }
            & $env:SIGNTOOL verify /pa /all $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($file.FullName)" }
          }
          $exe = Get-Item 'build/windows/x64/runner/Release/void_scriptor.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceRevision = (git rev-parse HEAD).Trim()
          $manifest = [ordered]@{
            format = 'void-scriptor-windows-signed-rc-v1'
            source_revision = $sourceRevision
            artifact = $exe.FullName.Replace((Get-Location).Path + '\\', '').Replace('\\', '/')
            sha256 = $hash
            signing = [ordered]@{
              status = 'SIGNED_AND_VERIFIED'
              algorithm = 'Authenticode-SHA256'
              subject = $env:SIGNING_SUBJECT
            }
          }
          New-Item -ItemType Directory -Force build/release-metadata | Out-Null
          $manifest | ConvertTo-Json -Depth 5 | Out-File build/release-metadata/windows-signed-rc-manifest.json -Encoding utf8
          Remove-Item $pfx -Force

      - name: Package signed Windows bundle
        shell: pwsh
        run: |
          $releaseLabel = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '${{ inputs.candidate_ref }}' }
          $releaseLabel = $releaseLabel -replace '[^A-Za-z0-9._-]', '-'
          if ([string]::IsNullOrWhiteSpace($releaseLabel)) { throw 'Release label is empty' }
          $metadata = Join-Path (Get-Location) 'build/release-metadata'
          $zipName = "VoidScriptor-$releaseLabel-windows-x64-signed.zip"
          $zipPath = Join-Path $metadata $zipName
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath $zipPath -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSize = (Get-Item -LiteralPath $zipPath).Length
          $signedManifest = Get-Content -LiteralPath (Join-Path $metadata 'windows-signed-rc-manifest.json') -Raw | ConvertFrom-Json
          $r2Key = "releases/windows/$releaseLabel/$zipName"
          $handoff = [ordered]@{
            format = 'void-scriptor-r2-handoff-v1'
            source_repository = 'nepht/void-scriptor'
            source_workflow = '.github/workflows/release-train.yml'
            source_revision = (git rev-parse HEAD).Trim()
            release_label = $releaseLabel
            artifact = $zipName
            object_key = $r2Key
            sha256 = $zipHash
            size_bytes = $zipSize
            signing = $signedManifest.signing
          }
          $handoffPath = Join-Path $metadata 'windows-signed-r2-handoff.json'
          $handoff | ConvertTo-Json -Depth 8 | Out-File -LiteralPath $handoffPath -Encoding utf8
          "R2_OBJECT_KEY=$r2Key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R2_ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R2_HANDOFF_PATH=$handoffPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Prepared signed bundle: $zipName ($zipSize bytes, SHA-256 $zipHash)"

      - name: Require R2 handoff secrets
        if: github.event_name == 'push' || inputs.publish_r2 == true
        shell: pwsh
        env:
          R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_UPLOAD_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $missing = @(
            if ([string]::IsNullOrWhiteSpace($env:R2_API_TOKEN)) { 'CLOUDFLARE_R2_UPLOAD_TOKEN' }
            if ([string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID)) { 'CLOUDFLARE_ACCOUNT_ID' }
          )
          if ($missing.Count -gt 0) {
            Write-Error ('R2 publication is fail-closed. Configure GitHub secret(s): ' + ($missing -join ', '))
            exit 1
          }
          if ('${{ github.event_name }}' -eq 'push') {
            $releaseLabel = '${{ github.ref_name }}'
          } else {
            $releaseLabel = '${{ inputs.candidate_ref }}'
          }
          if ($releaseLabel -notmatch '^v\d+\.\d+\.\d+-rc\.\d+$') {
            Write-Error "R2 publication requires a release-candidate ref like v1.2.0-rc.3; received '$releaseLabel'."
            exit 1
          }

      - name: Upload signed bundle and handoff to Cloudflare R2
        if: github.event_name == 'push' || inputs.publish_r2 == true
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.149.0 r2 object put "voidscriptor-downloads/$env:R2_OBJECT_KEY" --remote --file "$env:R2_ZIP_PATH"
          npx --yes wrangler@4.149.0 r2 object put "voidscriptor-downloads/$env:R2_OBJECT_KEY.json" --remote --file "$env:R2_HANDOFF_PATH"
          Write-Output "Published signed bundle and handoff: $env:R2_OBJECT_KEY"

      - name: Upload signed Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signed-release-candidate-${{ github.ref_name }}
          path: |
            build/windows/x64/runner/Release
            build/release-metadata/windows-signed-rc-manifest.json
            build/release-metadata/windows-signed-r2-handoff.json
            build/release-metadata/*.zip
          if-no-files-found: error
          retention-days: 30
