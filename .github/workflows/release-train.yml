name: Release Train

on:
  push:
    tags:
      - 'v1.2.0-rc.*'
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Commit, branch, or tag to package'
        required: true
        default: 'master'
        type: string
      publish_r2:
        description: 'Upload the signed Windows installer EXE to Cloudflare R2'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-bundle:
    name: Build RC candidate and checksum manifest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Verify repository hardening
        run: python3 tools/verify_repository_hardening.py

      - name: Run release candidate tests
        run: flutter test

      - name: Build supported candidate artifacts
        run: |
          flutter build linux --debug
          flutter build web --release
          flutter build apk --debug

      - name: Generate SBOM and notices
        run: python3 tools/generate_release_metadata.py

      - name: Generate candidate checksum manifest
        run: |
          python3 tools/generate_release_metadata.py \
            --artifacts-dir build \
            --manifest-path build/release-metadata/release-artifact-manifest.json

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: build/release-metadata/
          if-no-files-found: error
          retention-days: 30

      - name: Print release handoff
        run: |
          echo "RC bundle generated for ${{ github.ref_name }}."
          echo "GitHub Release publication remains an explicit D6 action."
          echo "Manifest: build/release-metadata/release-artifact-manifest.json"
          sha256sum build/release-metadata/release-artifact-manifest.json
      
      # Deliberately no release-publish step: Choirudin retains D6 authority.
      # The artifact and manifest are the verified handoff for that decision.

  windows-signed-candidate:
    name: Build and sign Windows RC candidate
    runs-on: windows-2022
    timeout-minutes: 45
    # Configure these repository/environment secrets before enabling a signed run:
    # WINDOWS_CODESIGN_PFX_BASE64, WINDOWS_CODESIGN_PFX_PASSWORD,
    # WINDOWS_CODESIGN_SUBJECT. Secrets are never written to logs or the repo.
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Build Windows release candidate
        run: flutter build windows --release --no-pub

      - name: Require signing secrets
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
        run: |
          $missing = @(
            if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { 'WINDOWS_CODESIGN_PFX_BASE64' }
            if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) { 'WINDOWS_CODESIGN_PFX_PASSWORD' }
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_SUBJECT)) { 'WINDOWS_CODESIGN_SUBJECT' }
          )
          if ($missing.Count -gt 0) {
            Write-Error ('Signing is fail-closed. Configure GitHub secret(s): ' + ($missing -join ', '))
            exit 1
          }
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'void-scriptor-signing.pfx'), $bytes)
          Remove-Variable PFX_BASE64 -ErrorAction SilentlyContinue

      - name: Locate SignTool
        shell: pwsh
        run: |
          $tool = Get-ChildItem -Path ${env:ProgramFiles(x86)}\Windows Kits\10\bin -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $tool) { throw 'signtool.exe was not found on windows-2022 runner' }
          "SIGNTOOL=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign Windows binaries
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'void-scriptor-signing.pfx'
          $files = Get-ChildItem -Path 'build/windows/x64/runner/Release' -Include *.exe,*.dll -File -Recurse
          if ($files.Count -eq 0) { throw 'No Windows executable or DLL was produced' }
          foreach ($file in $files) {
            & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($file.FullName)" }
            & $env:SIGNTOOL verify /pa /all $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($file.FullName)" }
          }
          Write-Output "Signed and verified $($files.Count) Windows binaries"

      - name: Build and sign Windows installer
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          SIGNING_SUBJECT: ${{ secrets.WINDOWS_CODESIGN_SUBJECT }}
        run: |
          $releaseLabel = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}' } else { '${{ inputs.candidate_ref }}' }
          $releaseLabel = $releaseLabel -replace '[^A-Za-z0-9._-]', '-'
          if ($releaseLabel -notmatch '^v\d+\.\d+\.\d+-rc\.\d+$') { throw "Installer publication requires a release-candidate label; received '$releaseLabel'." }
          $installerVersion = ($releaseLabel -replace '^v', '') -replace '-rc\.\d+$', ''
          $metadata = Join-Path (Get-Location) 'build/release-metadata'
          New-Item -ItemType Directory -Force $metadata | Out-Null
          $iscc = Get-ChildItem -Path @(${env:ProgramFiles(x86)}, ${env:ProgramFiles}) -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $iscc) { throw 'Inno Setup ISCC.exe was not found on windows-2022 runner' }
          $sourceDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = (Resolve-Path $metadata).Path
          & $iscc.FullName "/DAppVersion=$installerVersion" "/DReleaseLabel=$releaseLabel" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" 'packaging/windows/VoidScriptor.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installerName = "VoidScriptor-$releaseLabel-windows-x64-signed.exe"
          $installerPath = Join-Path $metadata $installerName
          if (-not (Test-Path -LiteralPath $installerPath)) { throw "Installer was not produced: $installerName" }
          $pfx = Join-Path $env:RUNNER_TEMP 'void-scriptor-signing.pfx'
          & $env:SIGNTOOL sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installerPath
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed for $installerName" }
          & $env:SIGNTOOL verify /pa /all $installerPath
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed for $installerName" }
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSize = (Get-Item -LiteralPath $installerPath).Length
          $sourceRevision = (git rev-parse HEAD).Trim()
          $r2Key = "releases/windows/$releaseLabel/$installerName"
          $manifest = [ordered]@{
            format = 'void-scriptor-windows-signed-installer-rc-v1'
            source_revision = $sourceRevision
            artifact = $installerName
            object_key = $r2Key
            sha256 = $installerHash
            size_bytes = $installerSize
            signing = [ordered]@{
              status = 'SIGNED_AND_VERIFIED'
              algorithm = 'Authenticode-SHA256'
              subject = $env:SIGNING_SUBJECT
            }
          }
          $manifestPath = Join-Path $metadata 'windows-signed-rc-manifest.json'
          $manifest | ConvertTo-Json -Depth 8 | Out-File -LiteralPath $manifestPath -Encoding utf8
          $handoff = [ordered]@{
            format = 'void-scriptor-r2-handoff-v1'
            source_repository = 'nepht/void-scriptor'
            source_workflow = '.github/workflows/release-train.yml'
            source_revision = $sourceRevision
            release_label = $releaseLabel
            artifact = $installerName
            object_key = $r2Key
            sha256 = $installerHash
            size_bytes = $installerSize
            signing = $manifest.signing
          }
          $handoffPath = Join-Path $metadata 'windows-signed-r2-handoff.json'
          $handoff | ConvertTo-Json -Depth 8 | Out-File -LiteralPath $handoffPath -Encoding utf8
          "R2_OBJECT_KEY=$r2Key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R2_EXE_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R2_HANDOFF_PATH=$handoffPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item $pfx -Force
          Write-Output "Prepared signed installer: $installerName ($installerSize bytes, SHA-256 $installerHash)"

      - name: Require R2 handoff secrets
        if: github.event_name == 'push' || inputs.publish_r2 == true
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $missing = @(
            if ([string]::IsNullOrWhiteSpace($env:R2_ACCESS_KEY_ID)) { 'CLOUDFLARE_R2_ACCESS_KEY_ID' }
            if ([string]::IsNullOrWhiteSpace($env:R2_SECRET_ACCESS_KEY)) { 'CLOUDFLARE_R2_SECRET_ACCESS_KEY' }
            if ([string]::IsNullOrWhiteSpace($env:R2_ACCOUNT_ID)) { 'CLOUDFLARE_ACCOUNT_ID' }
          )
          if ($missing.Count -gt 0) {
            Write-Error ('R2 publication is fail-closed. Configure GitHub secret(s): ' + ($missing -join ', '))
            exit 1
          }
          if ('${{ github.event_name }}' -eq 'push') {
            $releaseLabel = '${{ github.ref_name }}'
          } else {
            $releaseLabel = '${{ inputs.candidate_ref }}'
          }
          if ($releaseLabel -notmatch '^v\d+\.\d+\.\d+-rc\.\d+$') {
            Write-Error "R2 publication requires a release-candidate ref like v1.2.0-rc.3; received '$releaseLabel'."
            exit 1
          }

      - name: Upload signed installer and handoff to Cloudflare R2
        if: github.event_name == 'push' || inputs.publish_r2 == true
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          aws --version
          $endpoint = "https://$env:CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "$env:R2_EXE_PATH" "s3://voidscriptor-downloads/$env:R2_OBJECT_KEY" --endpoint-url $endpoint --region auto --no-progress --content-type "application/vnd.microsoft.portable-executable"
          aws s3 cp "$env:R2_HANDOFF_PATH" "s3://voidscriptor-downloads/$env:R2_OBJECT_KEY.json" --endpoint-url $endpoint --region auto --no-progress --content-type "application/json; charset=utf-8"
          Write-Output "Published signed installer and handoff: $env:R2_OBJECT_KEY"

      - name: Upload signed Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signed-release-candidate-${{ github.ref_name }}
          path: |
            build/windows/x64/runner/Release
            build/release-metadata/windows-signed-rc-manifest.json
            build/release-metadata/windows-signed-r2-handoff.json
            build/release-metadata/*.exe
          if-no-files-found: error
          retention-days: 30
