version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:31'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    ignore:
      # Insiden 13 Sep (ledger run284): bump mayor riverpod 2->3 ter-merge tanpa
      # CI lulus (billing mati) -> master merah 182 error. Riverpod 3 butuh
      # proyek migrasi terjadwal (14 breaking API tersisa), jadi blokir PR
      # mayor-nya sampai proyek itu selesai.
      - dependency-name: flutter_riverpod
        versions: '>=3.0.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:41'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci