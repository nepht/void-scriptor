name: void_scriptor
description: "Multiplatform creative studio for characters, worlds, and stories."
publish_to: 'none'
version: 1.2.0-alpha.1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  archive: ^4.0.7
  crypto: ^3.0.6
  drift: ^2.34.3
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: 10.3.1
  go_router: ^18.0.1
  http: ^1.6.0
  image: ^4.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  sqlite3: ^3.5.1
  uuid: ^4.6.0
  cryptography: ^2.9.0
  vector_math: ^2.2.0
  flutter_svg: ^2.0.10
  lucide_flutter: ^1.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/mascot/
    - assets/models/
    - assets/backgrounds/
    - assets/brands/ai_tech/
    - assets/brands/apps/
    - assets/brands/design_tools/
    - assets/brands/web_platforms/
    - assets/brands/ecommerce/
    - assets/brands/file_formats/
    - assets/brands/flags/
    - assets/brands/payment_methods/
    - assets/brands/platforms/
    - assets/brands/social_media/
    - assets/brands/tech/
    - assets/brands/own_brands/void_scriptor/
    - assets/fonts/SpaceGrotesk/
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Variable.ttf
          weight: 700
