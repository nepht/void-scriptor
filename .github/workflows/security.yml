name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action selalu mencoba menulis hasil (SARIF/check) via
      # GITHUB_TOKEN -> 403 "Resource not accessible by integration" pada
      # push/dependabot-event (terbukti 13 Sep 9dc198e/0393423) dan
      # bertabrakan dengan policy verify_repository_hardening.py yang
      # mewajibkan seluruh workflow read-only. CLI murni memberi kekuatan
      # scan + exit-code gate yang sama tanpa kebutuhan write apa pun;
      # .gitleaksignore tetap dihormati native.
      - name: Scan repository history
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo -v --redact --exit-code 1
