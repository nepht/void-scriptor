name: Multiplatform CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux-web-android:
    name: Analyze, test, Linux, Web, Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux debug
        run: flutter build linux --debug

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

  build-windows:
    name: Build Windows debug
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows debug
        run: flutter build windows --debug

  build-apple-platforms:
    name: Build macOS and iOS simulator
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Build macOS debug
        run: flutter build macos --debug

      - name: Build iOS simulator without signing
        run: flutter build ios --simulator --debug --no-codesign
